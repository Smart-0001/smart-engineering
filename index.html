<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Engineering | Next-Gen Tech & Engineering Solutions</title>
    <style>
        :root {
            --primary-blue: #0A2540;
            --tech-blue: #00D4B2;
            --accent-blue: #635BFF;
            --slate-grey: #639FAB;
            --light-grey: #F4F6F8;
            --dark-grey: #1C1F22;
            --white: #FFFFFF;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--white);
            color: var(--dark-grey);
            line-height: 1.6;
        }

        header {
            background-color: rgba(10, 37, 64, 0.95);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2rem;
        }

        .logo {
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--white);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: var(--tech-blue);
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--white);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            opacity: 0.85;
            transition: var(--transition);
        }

        .nav-links a:hover {
            color: var(--tech-blue);
            opacity: 1;
        }

        .hero {
            background: linear-gradient(135deg, var(--primary-blue) 0%, #001529 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 7rem 2rem 4rem 2rem;
            color: var(--white);
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .hero-tag {
            background: rgba(0, 212, 178, 0.1);
            color: var(--tech-blue);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(0, 212, 178, 0.2);
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 1.5rem;
        }

        .hero h1 span {
            color: var(--tech-blue);
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--slate-grey);
            margin-bottom: 2.5rem;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
        }

        .cta-btn {
            background-color: var(--tech-blue);
            color: var(--primary-blue);
            padding: 14px 32px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            display: inline-block;
            box-shadow: 0 4px 14px rgba(0, 212, 178, 0.3);
            transition: var(--transition);
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 178, 0.5);
        }

        .stats {
            background-color: var(--light-grey);
            padding: 4rem 2rem;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .stats-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-blue);
        }

        .stat-card p {
            color: var(--slate-grey);
            font-weight: 500;
            margin-top: 0.25rem;
        }

        .services {
            padding: 7rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .section-header h2 {
            font-size: 2.5rem;
            color: var(--primary-blue);
            font-weight: 800;
        }

        .section-header p {
            color: var(--slate-grey);
            font-size: 1.1rem;
            margin-top: 0.5rem;
        }

        .tab-menu {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .tab-btn {
            background: none;
            border: 2px solid var(--light-grey);
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary-blue);
            cursor: pointer;
            border-radius: 6px;
            transition: var(--transition);
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--primary-blue);
            color: var(--white);
            border-color: var(--primary-blue);
        }

        .tab-content {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
            background: var(--light-grey);
            padding: 3rem;
            border-radius: 12px;
        }

        .tab-content.active {
            display: grid;
        }

        .tab-text h3 {
            font-size: 1.75rem;
            margin-bottom: 1rem;
            color: var(--primary-blue);
        }

        .tab-text ul {
            list-style: none;
            margin-top: 1.5rem;
        }

        .tab-text ul li {
            position: relative;
            padding-left: 24px;
            margin-bottom: 0.75rem;
            font-weight: 500;
        }

        .tab-text ul li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: var(--tech-blue);
            font-weight: bold;
        }

        .tab-visual {
            background: linear-gradient(135deg, #E2E8F0 0%, #CBD5E1 100%);
            height: 300px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--primary-blue);
            border-left: 4px solid var(--tech-blue);
        }

        .reviews {
            background-color: var(--primary-blue);
            color: var(--white);
            padding: 6rem 2rem;
            text-align: center;
        }

        .review-container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            min-height: 200px;
        }

        .review-card {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .review-card.active {
            display: block;
        }

        .review-text {
            font-size: 1.5rem;
            font-style: italic;
            margin-bottom: 1.5rem;
            color: rgba(255,255,255,0.9);
        }

        .review-author {
            font-weight: 600;
            color: var(--tech-blue);
        }

        .contact {
            padding: 7rem 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .contact-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            background: var(--white);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid var(--light-grey);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--primary-blue);
        }

        .form-group input, .form-group textarea {
            padding: 12px;
            border: 2px solid var(--light-grey);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--tech-blue);
        }

        .submit-btn {
            grid-column: span 2;
            background-color: var(--primary-blue);
            color: var(--white);
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .submit-btn:hover {
            background-color: #123456;
        }

        footer {
            background-color: var(--dark-grey);
            color: rgba(255,255,255,0.6);
            padding: 3rem 2rem;
            text-align: center;
            font-size: 0.9rem;
